# tmux configuration for macOS and Ubuntu.
# Installed as a link: ~/.tmux.conf -> $DOTFILES_HOME/tmux/tmux.conf
#
# Layout: one session per workspace (open it with ws), one window per agent.
# Reload after editing: prefix + r.

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------

# Ctrl+Space. Press it twice to send Ctrl+Space to the program in the pane.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
# Neovim: no delay after Esc, and autoread sees focus changes.
set -sg escape-time 10
set -g focus-events on
# Copy mode keys: Space starts a selection and Enter copies it. With the
# default emacs keys, Ctrl+Space starts a selection, but it is the prefix.
setw -g mode-keys vi
# Truecolor for Neovim.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"

# -----------------------------------------------------------------------------
# Clipboard
# -----------------------------------------------------------------------------

# Text copied in tmux goes to the system clipboard. tmux hands it to the
# terminal (OSC 52), which also works over ssh. On macOS it also goes through
# pbcopy, for terminals that don't support OSC 52, such as Terminal.app.
set -s set-clipboard on
if -b 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy'

# -----------------------------------------------------------------------------
# Pane names
# -----------------------------------------------------------------------------

# Claude Code and Codex set the terminal title to the session name, with a
# status glyph in front, such as "✳ Fix login bug". @pane_label is that title
# without the glyph. A pane at a shell prompt shows its folder name instead,
# and a program that sets no title shows its command name.
set -g allow-set-title on
set -g @pane_label '#{?#{m/r:^-?(bash|zsh|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{s/^[^A-Za-z0-9 ]+ //:pane_title}}}'

# Window names follow the pane names.
setw -g automatic-rename on
setw -g automatic-rename-format '#{E:@pane_label}'

# Terminal tab title: "workspace: agent".
set -g set-titles on
set -g set-titles-string '#S: #{E:@pane_label}'

# -----------------------------------------------------------------------------
# Agent status
# -----------------------------------------------------------------------------

# A window shows ✅ when its agent has finished and you haven't looked yet, and
# ❓ when the agent waits for your answer. Agent hooks run
# ~/.claude/hooks/tmux-agent-state.sh (from claude/hooks/), which sets the
# window option @agent to done or waiting. Opening the window clears done.
# Waiting stays until you answer.
set -g @agent_glyph '#{?#{==:#{@agent},waiting},❓ ,#{?#{==:#{@agent},done},✅ ,}}'
set-hook -g session-window-changed 'if -F "#{==:#{@agent},done}" "set -wu @agent"'
set-hook -g client-session-changed 'if -F "#{==:#{@agent},done}" "set -wu @agent"'

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

set -g status-interval 5
set -g status-left ' #S | '
set -g status-left-length 30
# The right side lists every workspace with a finished or waiting agent, such
# as "husker ✅ labs ❓", so you see agents in the other sessions too.
set -g status-right-length 80
set -g status-right '#{S:#{?#{W:#{E:@agent_glyph}},#{session_name} #{W:#{E:@agent_glyph}},}}%H:%M '
set -g window-status-format ' #I #{E:@agent_glyph}#{=/30/...:#{E:@pane_label}} '
set -g window-status-current-format ' #I #{E:@agent_glyph}#{=/30/...:#{E:@pane_label}} '
set -g window-status-current-style 'reverse'

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# New windows and splits start in the current pane's folder, so they stay in
# the workspace.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move between panes with h, j, k and l.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# The lists on prefix + w and prefix + s open without the preview; v shows it.
bind w choose-tree -Zw -N
bind s choose-tree -Zs -N

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# -----------------------------------------------------------------------------
# Commands
# -----------------------------------------------------------------------------

# :ws dotfiles opens a workspace from the command prompt (prefix + :), the
# same way the ws shell function does. It works while an agent runs in the
# pane, and the pane stays in its session. :ws alone opens the pane's folder.
set -s command-alias[100] "ws=run-shell -E -c '#{pane_current_path}' 'sh \"\${DOTFILES_HOME:-\$HOME/Work/dotfiles}/tmux/ws.sh\" #{q:1}'"
