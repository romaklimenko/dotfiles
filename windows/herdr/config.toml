# herdr configuration. Installed to %APPDATA%\herdr\config.toml by
# install/install.ps1. Reload a running server with:
#   herdr server reload-config
# Print every available setting with: herdr --default-config

onboarding = false

[terminal]
# New panes open PowerShell 7 so the dotfiles profile loads. herdr falls back
# to Windows PowerShell 5.1, whose profile this setup never installs.
default_shell = "pwsh"

[keys]
# Prefix key (default ctrl+b). Ctrl+Space: thumb on Space, no stretch to a
# punctuation key. Windows Terminal passes it through unchanged. Inside herdr
# panes Ctrl+Space no longer reaches the shell, so PSReadLine's MenuComplete
# on Ctrl+Space is gone; the profile keeps MenuComplete on Tab.
# herdr 0.9.1 stable accepts one key here; the array form from the preview
# docs fails with "invalid type: sequence, expected a string". The old
# Windows Terminal remap of Ctrl+' to F12 (ctrl+vk(0xBF) in settings.json)
# is unused now and can be removed.
prefix = "ctrl+space"

# prefix+d reviews the workspace's working tree in hunk. The temporary pane
# inherits the workspace directory, reloads the diff as files change, and
# closes when hunk exits. On Windows herdr runs the command through cmd.exe,
# which finds hunk.cmd in the npm global directory.
[[keys.command]]
key = "prefix+d"
type = "pane"
command = "hunk diff --watch"
description = "review working tree in hunk"

# Neovim sidebar from the herdr-nvim plugin. Install it once with
#   herdr plugin install ChmaraX/herdr-nvim
# herdr binds no keys for plugins, so these two do it. Both keys replace
# herdr defaults: prefix+e was edit_scrollback and prefix+o was
# open_notification_target. Free alternatives on herdr 0.9.1 are prefix+f,
# prefix+i, prefix+m, prefix+u and prefix+a.
[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "toggle nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output in nvim sidebar"

# Command bar from the herdr-bar plugin: fuzzy-jump to any tab, pane or
# agent. Windows support lives in the romaklimenko/herdr-bar fork until
# jeffarese/herdr-bar#12 is merged. Install it once with
#   herdr plugin install romaklimenko/herdr-bar
# The plugin's own docs bind prefix+k, which herdr already uses for
# focus_pane_up. prefix+space is free: press Ctrl+Space, release, then Space.
[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar: jump to a tab, pane or agent"

[ui]
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

# Show Claude Code and Codex session titles in the agent sidebar.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "machine", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]
codex = [
  ["state_icon", "machine", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]
