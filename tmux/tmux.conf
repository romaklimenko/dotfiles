# tmux configuration shared by Ubuntu (tmux) and Windows (psmux).
# Installed to ~/.tmux.conf by install/install.sh and install/install.ps1.
# On Windows, ~/.psmux.conf loads this file first and then applies the
# psmux-only settings from windows/psmux/psmux.conf.
#
# Layout: one session per project, one window per agent.
# Reload after editing: prefix + r.

# -----------------------------------------------------------------------------
# Prefix
# -----------------------------------------------------------------------------

# Ctrl+Space, the same prefix herdr used. Press it twice to send Ctrl+Space to
# the program in the pane.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
# Neovim: no delay after Esc, and autoread sees focus changes.
set -sg escape-time 10
set -g focus-events on
# Truecolor for Neovim. Windows Terminal reports xterm-256color.
set -g default-terminal "tmux-256color"
# psmux.conf sets @psmux before it loads this file. psmux warns about
# options it does not have, so tmux-only options go in blocks like this.
%if "#{!=:#{@psmux},1}"
set -as terminal-features ",xterm-256color:RGB"
%endif

# -----------------------------------------------------------------------------
# Pane names
# -----------------------------------------------------------------------------

# Claude Code and Codex set the terminal title to the session name, with a
# status glyph in front, such as "✳ Fix login bug". @pane_label is that title
# without the glyph. A pane at a shell prompt shows its folder name instead,
# and a program that sets no title shows its command name.
set -g allow-set-title on
set -g @pane_label '#{?#{m/r:^(pwsh|powershell|cmd|bash|zsh|sh|fish)$,#{pane_current_command}},#{b:pane_current_path},#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{s/^[^A-Za-z0-9 ]+ //:pane_title}}}'

# Window names. psmux does not have automatic-rename-format; psmux.conf
# names windows another way.
setw -g automatic-rename on
%if "#{!=:#{@psmux},1}"
setw -g automatic-rename-format '#{E:@pane_label}'
%endif

# Windows Terminal tab title: "project: agent".
set -g set-titles on
set -g set-titles-string '#S: #{E:@pane_label}'

# -----------------------------------------------------------------------------
# Status bar
# -----------------------------------------------------------------------------

set -g status-interval 5
set -g status-left ' #S | '
set -g status-left-length 30
set -g status-right '%H:%M '
set -g window-status-format ' #I #{=/30/...:#{E:@pane_label}} '
set -g window-status-current-format ' #I #{=/30/...:#{E:@pane_label}} '
set -g window-status-current-style 'reverse'

# -----------------------------------------------------------------------------
# Key bindings
# -----------------------------------------------------------------------------

# New windows and splits start in the current pane's folder, so they stay in
# the project.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Move between panes with h, j, k and l, as in herdr.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
