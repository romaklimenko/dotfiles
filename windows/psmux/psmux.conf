# psmux configuration for Windows. Installed to ~/.psmux.conf by
# install/install.ps1. psmux reads ~/.psmux.conf before ~/.tmux.conf, so this
# file loads the shared tmux config and then changes what differs on Windows.

# Skips the tmux-only blocks in ~/.tmux.conf.
set -g @psmux 1
source-file ~/.tmux.conf

set -g default-shell pwsh

# psmux ignores automatic-rename-format and names windows after the process,
# so every agent window would read "claude". With automatic-rename off and
# allow-rename on, the window name is the pane's terminal title instead, so
# prefix + w lists agent windows by their session titles. The status bar
# uses @pane_label.
setw -g automatic-rename off
setw -g allow-rename on

# The lists on prefix + w and prefix + s open without the preview. This is
# psmux's default, set here to make it explicit. Each terminal remembers
# p, the preview toggle, until it detaches: after p the preview opens with
# every list until p is pressed again.
set -g choose-tree-preview off

# psmux runs one server per session, so a reload reaches the current session
# only. Restart psmux (tmux kill-server) to apply changes everywhere.
bind r source-file ~/.psmux.conf \; display-message "Config reloaded (this session)"
